services:
  - type: web
    name: panchang-backend
    runtime: python
    rootDir: backend
    region: oregon                 # pick closest to your users; singapore also available
    plan: free                     # free tier — upgrade to starter for always-on
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs         # Render pings this; FastAPI exposes /docs by default

    envVars:
      # ── LLM ───────────────────────────────────────────────────────────────
      - key: LLM_MODEL
        value: google_genai:gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false                # paste your key in Render dashboard → Environment

      - key: LLM_SCRUB_ENABLED
        value: "1"

      # ── Database (Neon) ───────────────────────────────────────────────────
      # Do NOT use fromDatabase here — you are on Neon, not Render Postgres.
      # Paste your full Neon connection string in Render dashboard → Environment.
      - key: DATABASE_URL
        sync: false                # e.g. postgresql://user:pass@ep-xxx.neon.tech/panchang?sslmode=require

      # ── CORS ─────────────────────────────────────────────────────────────
      # Add your frontend URL(s) here. The Render service URL is auto-assigned
      # as https://panchang-backend.onrender.com — add that plus any custom domain.
      - key: CORS_ALLOW_ORIGINS
        value: "https://panchang-backend.onrender.com"
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: "^https://.*\\.onrender\\.com$"

      # ── Festival snapshot prewarming ──────────────────────────────────────
      - key: FESTIVAL_SNAPSHOT_PREWARM_ENABLED
        value: "1"
      # 4 major Indian cities: Delhi, Mumbai, Chennai, Kolkata
      - key: FESTIVAL_SNAPSHOT_PREWARM_POINTS
        value: "28.6139:77.2090;19.0760:72.8777;13.0827:80.2707;22.5726:88.3639"
      - key: FESTIVAL_SNAPSHOT_PREWARM_YEARS
        value: "1"
      - key: FESTIVAL_SNAPSHOT_PREWARM_TZ
        value: "Asia/Kolkata"
      - key: FESTIVAL_SNAPSHOT_PREWARM_AYANAMSA
        value: "lahiri"

# NOTE: No `databases:` section — using Neon Postgres, not Render Postgres.
# If you ever want to migrate to Render's managed Postgres, add it back here
# and remove the DATABASE_URL sync: false entry above.
